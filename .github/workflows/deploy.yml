name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: 🚀 Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Project
        run: npm run build

      - name: 📂 Sync files to server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Set the port if you're using SFTP (usually 22) or FTPS (usually 21 or 990).
          # You can add FTP_PORT to your GitHub Secrets if needed.
          port: ${{ 21 }}
          # Target folder on the server
          server-dir: /web/
          # Source folder in the build environment
          local-dir: ./dist/
          # Set to true if you want to see detailed logs for debugging
          # protocol: sftp # Uncomment this line if you are using SFTP
